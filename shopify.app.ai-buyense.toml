# Production configuration linked to Shopify app "Buysence"

client_id = "45bd60344ab642cfca66bdad79917deb"
name = "Buysence"
application_url = "https://buysenseshopify.com"
embedded = true

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = [ "app_subscriptions/update" ]
uri = "/webhooks/app/subscriptions_update"

[[webhooks.subscriptions]]
topics = [ "products/create" ]
uri = "/webhooks/products/create"

[[webhooks.subscriptions]]
topics = [ "products/update" ]
uri = "/webhooks/products/update"

[[webhooks.subscriptions]]
topics = [ "products/delete" ]
uri = "/webhooks/products/delete"

[access_scopes]
scopes = "read_products,read_themes,read_locales,write_app_proxy"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://buysenseshopify.com/auth/callback" ]

[app_proxy]
url = "/proxy/ai-search"
subpath = "ai-search"
prefix = "apps"

[[access.metafields]]
namespace = "ai_search"
key = "theme_map"
access = "public_read"

# Shopify App Store mandatory compliance webhook subscriptions.
# These must be deployed as a Shopify app version, not just pushed to Git.
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "/webhooks/shop/redact"
