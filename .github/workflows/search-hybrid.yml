name: Hybrid Search CI

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://root:local-ci-password@127.0.0.1:3306/ai_search_ci
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-ci-password
          MYSQL_DATABASE: ai_search_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocal-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Language activation and no-result ordering regression
        run: npx tsx scripts/catalog-language-atomicity-selftest.ts
      - run: npm run typecheck
      - run: npm run test:search-hybrid
      - name: Shopify snapshot batching and sort-only price regression
        run: npx tsx scripts/audit-search-live-snapshots-selftest.ts
      - name: System audit and data invariants
        run: npm run test:system-audit
      - name: Billing lifecycle policy regressions
        run: npm run test:billing-core
      - name: Dashboard data presentation regressions
        run: npm run test:data-bound-ui
      - name: Storefront native/result count regression
        run: node scripts/storefront-selftest.cjs
        env:
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
      - name: Qdrant dense + BM25 smoke
        run: npx tsx scripts/qdrant-bm25-smoke.ts
        env:
          QDRANT_URL: http://127.0.0.1:6333
          QDRANT_API_KEY: local-ci-key
          QDRANT_COLLECTION_V9: ai_search_ci_v9_1536_bm25
          OPENAI_EMBEDDING_MODEL: text-embedding-3-small
